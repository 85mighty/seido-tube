<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  :root{--bg:#fff9e6;--ink:#1e1e1e;--red:#d32f2f;--yel:#ffd54f;--navy:#1a3a5c;--blue:#2b5fd9;--pink:#f06b8a;--w:1920px;--h:1080px}
  *{box-sizing:border-box;margin:0}
  body{width:var(--w);height:var(--h);background:var(--bg);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:var(--ink);overflow:hidden}
  .frame{width:100%;height:100%;padding:60px 100px;display:flex;flex-direction:column;gap:34px;position:relative}
  .hdr{display:inline-block;background:var(--blue);color:#fff;font-size:54px;font-weight:900;padding:10px 40px;border-radius:14px;align-self:flex-start}
  h1{font-size:68px;font-weight:900;line-height:1.25}
  h1 em{font-style:normal;color:var(--red);background:var(--yel);padding:0 14px;border-radius:12px}
  .big{font-size:200px;font-weight:900;color:var(--red);text-align:center;line-height:1.1;letter-spacing:-4px;text-shadow:6px 6px 0 var(--yel)}
  .sub{font-size:60px;font-weight:700;text-align:center;color:var(--navy)}
  ul{list-style:none;font-size:60px;font-weight:700;display:flex;flex-direction:column;gap:28px}
  li::before{content:"✔";color:var(--red);margin-right:24px}
  table{border-collapse:collapse;width:100%;font-size:48px;font-weight:700}
  th{background:var(--navy);color:#fff;padding:18px}
  td{background:#fff;border:3px solid #ccc;padding:18px;text-align:center}
  tr:nth-child(even) td{background:#f3f3f3}
  td.hl{background:#fff;outline:6px solid var(--red);outline-offset:-6px;font-size:56px}
  .callout{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);background:#fff3cd;border:4px solid #e6c15a;border-radius:40px;padding:40px 70px;font-size:76px;font-weight:900;box-shadow:0 14px 40px rgba(0,0,0,.25);text-align:center;line-height:1.3;max-width:1500px}
  .callout b{color:var(--red)}
  .compare{display:flex;flex:1;border:10px solid #333;border-radius:20px;overflow:hidden}
  .compare>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:30px;background:#eef1f5}
  .compare>div img{height:420px;object-fit:contain;margin-bottom:20px}
  .compare .lab{width:100%;text-align:center;font-size:90px;font-weight:900;color:#fff;padding:8px 0}
  .compare .ver{width:100%;text-align:center;font-size:110px;font-weight:900;background:#fff;padding:6px 0}
  .compare .l .lab{background:var(--blue)} .compare .l .ver{color:var(--blue)}
  .compare .r .lab{background:var(--red)}  .compare .r .ver{color:var(--red)}
  .timeline{display:flex;flex:1;gap:30px}
  .timeline .chars{display:flex;flex-direction:column;justify-content:space-around;width:300px}
  .timeline .chars div{text-align:center;font-size:40px;font-weight:900}
  .timeline .chars img{height:200px;object-fit:contain;display:block;margin:0 auto}
  .timeline svg{flex:1;height:100%}
  .character{position:absolute;right:90px;bottom:120px;height:380px;object-fit:contain}
  .foot{margin-top:auto;font-size:32px;color:#777;display:flex;justify-content:space-between}
  /* thumbnail */
  .thumb{width:100%;height:100%;display:flex;background:linear-gradient(135deg,#ffe6ea,#fff6d6);padding:40px}
  .thumb .ribbon{writing-mode:vertical-rl;background:var(--red);color:#fff;font-size:130px;font-weight:900;padding:30px 20px;border-radius:20px;margin-right:30px;letter-spacing:10px}
  .thumb .main{flex:1;display:flex;flex-direction:column;border:14px solid #333;border-radius:30px;overflow:hidden;background:#fff}
  .thumb .main .t{background:#111;color:#fff;font-size:120px;font-weight:900;text-align:center;padding:10px}
  .thumb .main .t em{font-style:normal;color:var(--yel)}
  .thumb .compare{border:none;border-radius:0}
</style></head>
<body><div class="frame">
  <div class='hdr'>在職老齢年金の基準額</div><div class='timeline'><div class='chars'><div>60〜64歳</div><div>65歳以上</div></div><svg viewBox='0 0 1300 820' xmlns='http://www.w3.org/2000/svg'><line x1='60.0' y1='20' x2='60.0' y2='730' stroke='#333' stroke-width='4' stroke-dasharray='14,10'/><text x='215.0' y='790' font-size='40' font-weight='700' text-anchor='middle'>2022年3月</text><line x1='370.0' y1='20' x2='370.0' y2='730' stroke='#333' stroke-width='4' stroke-dasharray='14,10'/><text x='525.0' y='790' font-size='40' font-weight='700' text-anchor='middle'>4月</text><line x1='680.0' y1='20' x2='680.0' y2='730' stroke='#333' stroke-width='4' stroke-dasharray='14,10'/><text x='835.0' y='790' font-size='40' font-weight='700' text-anchor='middle'>2023年4月</text><line x1='990.0' y1='20' x2='990.0' y2='730' stroke='#333' stroke-width='4' stroke-dasharray='14,10'/><text x='1145.0' y='790' font-size='40' font-weight='700' text-anchor='middle'>2024年4月</text><line x1='60' y1='730' x2='1290' y2='730' stroke='#d32f2f' stroke-width='6' marker-end='url(#a)'/><defs><marker id='a' markerWidth='10' markerHeight='10' refX='5' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect x='66.0' y='40.0' width='298.0' height='210.0' fill='#2b5fd9' rx='4'/><text x='215.0' y='161.0' font-size='48' font-weight='900' fill='#fff' text-anchor='middle'>28万円</text><rect x='376.0' y='40.0' width='298.0' height='210.0' fill='#f06b8a' rx='4'/><text x='525.0' y='161.0' font-size='48' font-weight='900' fill='#fff' text-anchor='middle'>47万円</text><rect x='66.0' y='390.0' width='298.0' height='210.0' fill='#2b5fd9' rx='4'/><text x='215.0' y='511.0' font-size='48' font-weight='900' fill='#fff' text-anchor='middle'>47万円</text><rect x='376.0' y='390.0' width='298.0' height='210.0' fill='#f06b8a' rx='4'/><text x='525.0' y='511.0' font-size='48' font-weight='900' fill='#fff' text-anchor='middle'>47万円</text></svg></div>
  <div class="foot"><span>制度ノート</span><span>what</span></div>
</div></body></html>
