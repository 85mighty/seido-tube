<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  :root{--red:#d32f2f;--yel:#ffd54f;--blue:#2b5fd9}
  *{box-sizing:border-box;margin:0}
  body{width:1280px;height:720px;overflow:hidden;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;background:linear-gradient(135deg,#ffe6ea,#fff6d6)}
  .wrap{width:100%;height:100%;padding:24px;display:flex;gap:18px}
  .ribbon{width:150px;background:var(--red);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:900;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:4px;white-space:nowrap;box-shadow:0 8px 0 #8e1d1d}
  .main{flex:1;display:flex;flex-direction:column;border:10px solid #222;border-radius:22px;overflow:hidden;background:#fff}
  .t{background:#111;color:#fff;font-size:82px;font-weight:900;text-align:center;padding:4px 10px;white-space:nowrap}
  .t em{font-style:normal;color:var(--yel)}
  .cmp{flex:1;display:flex}
  .cmp>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:#eef1f5}
  .cmp .note{flex:1;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:800;color:#333;text-align:center;padding:10px 16px;line-height:1.15}
  .cmp .lab{font-size:70px;font-weight:900;color:#fff;text-align:center;padding:2px 0;white-space:nowrap}
  .cmp .ver{font-size:96px;font-weight:900;background:#fff;text-align:center;padding:0 0 6px;white-space:nowrap;line-height:1.1}
  .l .lab{background:var(--blue)} .l .ver{color:var(--blue)} .l{border-right:6px solid #222}
  .r .lab{background:var(--red)}  .r .ver{color:var(--red)}
</style></head>
<body><div class="wrap">
  <div class="ribbon">{{RIBBON}}</div>
  <div class="main"><div class="t">{{TITLE}}</div>
    <div class="cmp">
      <div class="l"><div class="note">{{LNOTE}}</div><div class="lab">{{LLAB}}</div><div class="ver">{{LVER}}</div></div>
      <div class="r"><div class="note">{{RNOTE}}</div><div class="lab">{{RLAB}}</div><div class="ver">{{RVER}}</div></div>
    </div></div>
</div></body></html>
