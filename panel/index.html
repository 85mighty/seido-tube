<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>{{SLUG}} — 検収</title>
<style>
  body{font-family:-apple-system,"Noto Sans CJK JP","Noto Sans KR",sans-serif;margin:0;background:#f4f4f6;color:#222}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
  header h1{font-size:16px;margin:0;flex:1;min-width:300px}
  button{border:1px solid #bbb;background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
  button.p{background:#2b5fd9;color:#fff;border-color:#2b5fd9} button.d{background:#d32f2f;color:#fff;border-color:#d32f2f}
  button:disabled{opacity:.4}
  main{max-width:1500px;margin:0 auto;padding:20px}
  .top{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:20px;align-items:start}
  .thumbbar{display:grid;grid-template-columns:420px 1fr;gap:16px;margin-bottom:16px}
  #inspector .sl{background:#fff}
  #inspector .sl img{aspect-ratio:16/9;object-fit:contain}
  .sl.playing{outline:3px solid #ff3b3b}
  video{width:100%;background:#000;border-radius:8px}
  .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px}
  .sec{background:#fff;border:1px solid #ddd;border-radius:8px;margin-bottom:18px;overflow:hidden}
  .sec>.h{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#1a3a5c;color:#fff;flex-wrap:wrap}
  .sec>.h b{font-size:15px} .sec>.h .t{opacity:.85;font-size:13px}
  .sec>.body{display:grid;grid-template-columns:380px 1fr;gap:14px;padding:14px}
  textarea{width:100%;box-sizing:border-box;font:13px/1.5 inherit;border:1px solid #ccc;border-radius:6px;padding:8px}
  input,select{font:13px inherit;border:1px solid #ccc;border-radius:6px;padding:6px;width:100%;box-sizing:border-box}
  .slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .sl{border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fafafa}
  .sl img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#eee;cursor:pointer}
  .sl .m{padding:8px;font-size:12px}
  .sl .time{font-weight:700;color:#2b5fd9} .sl .f label{display:block;margin:6px 0 2px;color:#666;font-size:11px}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  pre{background:#111;color:#9f9;font-size:11px;padding:10px;max-height:240px;overflow:auto;border-radius:6px;white-space:pre-wrap}
  .badge{background:#ffd54f;border-radius:10px;padding:2px 8px;font-size:12px}
  .thumb img{width:100%;border-radius:6px;cursor:pointer}
  #tl{position:relative;display:flex;height:64px;background:#222;border-radius:6px;margin-top:8px;overflow:hidden}
  #tl .blk{position:relative;height:100%;border-right:2px solid #000;background:#444 center/cover;cursor:pointer;min-width:2px}
  #tl .blk span{position:absolute;left:3px;bottom:2px;font-size:10px;color:#fff;text-shadow:0 0 3px #000;white-space:nowrap}
  #tl .blk.sec0{border-left:3px solid #ffd54f}
  #ph{position:absolute;top:0;bottom:0;width:2px;background:#ff3b3b;pointer-events:none}
  .sl .nar{font-size:12px;line-height:1.5;background:#fff}
  #ed{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;align-items:center;justify-content:center}
  #ed .box{background:#fff;border-radius:10px;padding:12px;display:grid;grid-template-columns:1344px 300px;gap:12px;max-height:96vh;overflow:auto}
  #cv{position:relative;width:1344px;height:756px;background:#eee center/contain no-repeat;border:1px solid #999;overflow:hidden;user-select:none}
  .ovx{position:absolute;box-sizing:border-box;display:flex;align-items:center;white-space:pre-wrap;line-height:1.2;overflow:hidden;cursor:move;outline:1px dashed rgba(0,0,0,.25)}
  .ovx.sel{outline:2px solid #2b5fd9}
  .ovx .rz{position:absolute;right:0;bottom:0;width:14px;height:14px;background:#2b5fd9;cursor:nwse-resize}
  #props label,#thumbForm label{display:block;font-size:11px;color:#666;margin:6px 0 2px}
  #props .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
</style></head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="status" class="badge" style="display:none">작업 중…</span><span id="est" class="badge" style="display:none;background:#cfe3ff">음성 전 — 시간은 추정치</span>
  <button onclick="job('render')" class="p">🔊 음성 생성 + 영상 렌더</button><button onclick="job('images')">🖼 이미지만 다시</button>
  <button onclick="reslice()" title="대본은 그대로, 슬라이드만 AI가 15~25초 단위로 다시 잘라 이미지를 늘림 (토큰만 사용, 음성 재사용)">✂️ AI로 전체 더 잘게</button>
  <button onclick="job('upload')">YouTube 업로드(비공개)</button>
  <button onclick="job('upload',{publish:true})">금 19:00 공개예약</button>
  <button onclick="job('blog',{wp:true,hatena:true,draft:true})">블로그 초안 생성</button>
  <button onclick="toggleLog()">로그</button>
</header>
<div id="ed"><div class="box">
  <div><div id="cv" onmousedown="cvDown(event)"></div>
    <div class="row"><button onclick="addOv('text')">＋텍스트</button><button onclick="addOv('box')">＋상자</button><button onclick="addOv('hl')">＋노란 강조</button><button onclick="addOv('arrow')">＋화살표</button>
    <button class="d" onclick="delOv()">선택 삭제</button><span style="flex:1"></span><button onclick="edExplode()" title="자동 생성된 제목·항목·표 셀을 전부 개별 요소로 바꿔 이동/크기/글자 편집">🔓 글자를 요소로 변환</button><button onclick="edRestore()" id="edRestoreBtn" style="display:none">↩ 원래 자동 레이아웃</button><button onclick="edPreview()">미리보기</button><button class="p" onclick="edSave()">저장</button><button onclick="edClose()">닫기</button></div>
    <small style="color:#666">드래그=이동, 오른쪽아래 파란점=크기, 더블클릭=텍스트 편집. 좌표는 1920×1080 기준(화면은 70% 축소)</small></div>
  <div id="props"></div></div></div>
<main>
  <pre id="log" style="display:none"></pre>
  <div class="card thumbbar">
    <div><b>썸네일</b> <small>(클릭=미리보기 갱신)</small><img id="thumb" onclick="previewThumb()" style="width:100%;border-radius:6px;cursor:pointer"></div>
    <div><div class="f" id="thumbForm"></div>
      <div class="row"><button onclick="previewThumb()">미리보기</button><button class="p" onclick="saveThumb()">저장</button></div>
      <label style="font-size:11px;color:#666;display:block;margin-top:8px">제목</label><input id="ytitle">
      <div class="row"><button class="p" onclick="saveTitle()">제목 저장</button></div></div>
  </div>
  <div class="top">
    <div><video id="video" controls preload="metadata"></video><div id="novideo" style="color:#888;padding:10px">final.mp4 없음 — 재렌더 필요</div><div id="tl"><div id="ph"></div></div><small style="color:#666">타임라인: 폭=길이, 클릭=이동, 노란 선=섹션 시작</small></div>
    <div id="inspector"><div class="card" style="color:#888">영상을 재생하면 지금 나오는 화면의 편집 폼이 여기에 표시됩니다</div></div>
  </div>
  <div id="sections"></div>
</main>
<script>
const SLUG="{{SLUG}}"; let S=null;
const $=s=>document.querySelector(s); const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=(p,b)=>fetch(`/api/${SLUG}/${p}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
async function load(){S=await (await fetch(`/api/${SLUG}/state`)).json();render();}
function render(){
  $("#title").textContent=S.title; $("#ytitle").value=S.title;
  $("#status").style.display=S.running?"":"none"; $("#log").textContent=S.log; $("#est").style.display=S.sections.some(s=>s.estimated)?"":"none";
  const v=$("#video"); if(S.video){const src=S.video+"?v="+S.video_mtime; if(v.dataset.src!==src){v.src=src;v.dataset.src=src;} v.style.display="";$("#novideo").style.display="none";} else {v.style.display="none";$("#novideo").style.display="";}
  if(S.thumbnail) $("#thumb").src=S.thumbnail+"?v="+S.video_mtime;
  if(!$("#thumbForm").children.length){ const th=S.thumb||{};
    $("#thumbForm").innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label>リボン</label><input id="th_ribbon"></div><div><label>タイトル(7文字)</label><input id="th_title"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:6px"><div><label>左 note</label><input id="th_lnote"></div><div><label>左 label</label><input id="th_llab"></div><div><label>左 verdict(4文字)</label><input id="th_lver"></div>
    <div><label>右 note</label><input id="th_rnote"></div><div><label>右 label</label><input id="th_rlab"></div><div><label>右 verdict</label><input id="th_rver"></div></div>`;
    fetch(`/files/${SLUG}/script.json`).then(r=>r.json()).then(js=>{const t=js.thumbnail||{};$("#th_ribbon").value=t.ribbon||"知らなきゃ損！";$("#th_title").value=t.title||"";
      $("#th_lnote").value=t.left?.note||"";$("#th_llab").value=t.left?.label||"";$("#th_lver").value=t.left?.verdict||"";$("#th_rnote").value=t.right?.note||"";$("#th_rlab").value=t.right?.label||"";$("#th_rver").value=t.right?.verdict||"";});
  }
  $("#sections").innerHTML=S.sections.map(sec=>`
  <div class="sec" id="sec_${sec.id}"><div class="h"><b>${sec.id}</b><span class="t">${fmt(sec.start)} 〜 ${fmt((sec.start||0)+(sec.dur||0))} (${(sec.dur||0).toFixed(1)}s · ${sec.chars}字)</span>
    ${sec.audio?`<audio controls preload="none" src="${sec.audio}?v=${S.video_mtime}" style="height:30px"></audio>`:`<span class="badge">음성 아직 없음</span>`}
    <span style="flex:1"></span><button onclick="reslice('${sec.id}')">✂️ 이 섹션 더 잘게</button><button onclick="seek(${sec.start||0})">▶ 영상 여기로</button></div>
   <div class="body"><div>
      <textarea rows="14" id="nar_${sec.id}">${esc(sec.narration)}</textarea>
      <div class="row"><button class="p" onclick="saveNar('${sec.id}')">대본 저장</button><button onclick="retts('${sec.id}')">이 섹션 음성 재생성 + 렌더</button></div>
      <small style="color:#666">음성은 슬라이드 단위로 생성되어 화면 길이 = 음성 길이 (바뀐 슬라이드만 재생성)</small></div>
    <div class="slides">${sec.slides.map(sl=>slideCard(sec.id,sl)).join("")}</div></div></div>`).join("");
  const total=Math.max(1,...S.sections.map(s=>(s.start||0)+(s.dur||0)));
  $("#tl").innerHTML='<div id="ph"></div>'+S.sections.map(sec=>sec.slides.map((sl,j)=>`<div class="blk ${j===0?"sec0":""}" style="flex:${Math.max(0.5,sl.end-sl.start)};background-image:url('${sl.img?sl.img+"?v="+S.video_mtime:""}')" onclick="seek(${sl.start});document.getElementById('sl_${sec.id}_${sl.idx}').scrollIntoView({behavior:'smooth',block:'center'})" title="${sec.id} ${fmt(sl.start)}"><span>${j===0?sec.id:""}</span></div>`).join("")).join("");
  $("#video").ontimeupdate=()=>{$("#ph").style.left=(100*$("#video").currentTime/total)+"%";updateInspector();};
  $("#video").onseeked=()=>updateInspector();
  INS.key=null;updateInspector(true);
  // 아직 렌더되지 않은 슬라이드(추가 직후)는 미리보기로 즉시 채움
  S.sections.forEach(sec=>sec.slides.forEach(sl=>{if(!sl.img)preview(sec.id,sl.idx);}));
}
function fmt(t){t=Math.round(t||0);return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`}
function seek(t){const v=$("#video");v.currentTime=t;v.play();window.scrollTo({top:0,behavior:"smooth"})}
function slideCard(sid,sl,pfx=""){const sp=sl.spec,k=sp.kind||"bullets",id=`${pfx}${sid}_${sl.idx}`;
  const F=(l,i,v,ta)=>`<label>${l}</label>`+(ta?`<textarea rows="3" id="${id}_${i}">${esc(v)}</textarea>`:`<input id="${id}_${i}" value="${esc(v)}">`);
  let f="";
  if(k==="title"||k==="number") f=F("big","big",sp.big)+F("sub","sub",sp.sub);
  else if(k==="bullets") f=F("title","title",sp.title)+F("items (1行1項目)","items",(sp.items||[]).join("\n"),1);
  else if(k==="table") f=F("title","title",sp.title)+F("header (,区切り)","header",(sp.header||[]).join(","))+F("rows (1行1列, ,区切り)","rows",(sp.rows||[]).map(r=>r.join(",")).join("\n"),1)+F("highlight 行,列 (0始まり)","highlight",(sp.highlight||[]).join(","))+F("callout (25文字, 改行は<br>)","callout",sp.callout||"");
  else if(k==="compare") f=F("title","title",sp.title)+F("左 note / label / verdict","left",[sp.left?.note,sp.left?.label,sp.left?.verdict].join(" / "))+F("右 note / label / verdict","right",[sp.right?.note,sp.right?.label,sp.right?.verdict].join(" / "));
  else if(k==="free") f=F("title (空なら見出しなし)","title",sp.title||"")+`<small style="color:#666">자유 슬라이드: 내용은 🎨 배치 편집에서</small>`;
  else f=F("JSON","json",JSON.stringify(sp,null,1),1);
  return `<div class="sl" id="sl_${id}"><img src="${sl.img?sl.img+"?v="+S.video_mtime:""}" onclick="edOpen('${sid}',${sl.idx},'${pfx}')" title="클릭=편집창 열기">
   <div class="m"><span class="time">${fmt(sl.start)} 〜 ${fmt(sl.end)}</span> <button onclick="seek(${sl.start})" style="padding:2px 6px">▶</button> · <select id="${id}_kind" onchange="changeKind('${sid}',${sl.idx},this.value)">${["title","bullets","table","compare","number","timeline","bar","free"].map(x=>`<option ${x===k?"selected":""}>${x}</option>`).join("")}</select>
   <div class="f"><label>この画面で読まれるナレーション ${sp.narration!==undefined?"":"<span class='badge'>自動分配 (저장하면 확정)</span>"}</label><textarea class="nar" rows="5" id="${id}_nar">${esc(sl.narration)}</textarea>
   ${f}${F("alt (ブログ用説明)","alt",sp.alt||"")}${sp.narration!==undefined?"":F("weight (時間配分の比重, 既定1)","weight",sp.weight||1)}</div>
   <div class="row"><button onclick="preview('${sid}',${sl.idx},'${pfx}')">미리보기</button><button class="p" onclick="saveSlide('${sid}',${sl.idx},'${pfx}')">저장</button><button onclick="edOpen('${sid}',${sl.idx},'${pfx}')">🎨 배치 편집${(sp.overlays||[]).length?` (${sp.overlays.length})`:""}</button>
   <button onclick="op('${sid}',${sl.idx},'add')">＋뒤에 추가</button><button onclick="op('${sid}',${sl.idx},'up')">↑</button><button onclick="op('${sid}',${sl.idx},'down')">↓</button><button class="d" onclick="if(confirm('삭제?'))op('${sid}',${sl.idx},'del')">삭제</button></div></div></div>`;}
function collect(sid,idx,pfx=""){const id=`${pfx}${sid}_${idx}`,g=i=>$(`#${id}_${i}`)?.value??"",k=$(`#${id}_kind`).value;let sp={kind:k};
  if(k==="title"||k==="number") Object.assign(sp,{big:g("big"),sub:g("sub")});
  else if(k==="bullets") Object.assign(sp,{title:g("title"),items:g("items").split("\n").filter(x=>x.trim())});
  else if(k==="table"){const hl=g("highlight").split(",").map(x=>parseInt(x)).filter(x=>!isNaN(x));
    Object.assign(sp,{title:g("title"),header:g("header").split(","),rows:g("rows").split("\n").filter(x=>x.trim()).map(r=>r.split(",")),highlight:hl.length===2?hl:null,callout:g("callout")||null});}
  else if(k==="compare"){const L=g("left").split("/").map(x=>x.trim()),R=g("right").split("/").map(x=>x.trim());
    Object.assign(sp,{title:g("title"),left:{note:L[0],label:L[1],verdict:L[2]},right:{note:R[0],label:R[1],verdict:R[2]}});}
  else if(k==="free"){Object.assign(sp,{title:g("title")});const c0=S.sections.find(s=>s.id===sid).slides[idx].spec;if(c0._orig)sp._orig=c0._orig;}
  else {try{sp=JSON.parse(g("json"))}catch(e){alert("JSON 오류: "+e.message);throw e}}
  sp.alt=g("alt"); sp.weight=parseFloat(g("weight"))||1;
  const cur=S.sections.find(s=>s.id===sid).slides[idx].spec; if(cur.overlays) sp.overlays=cur.overlays;
  if($(`#${id}_nar`)) sp.narration=$(`#${id}_nar`).value; return sp;}
async function preview(sid,idx,pfx=""){const sp=collect(sid,idx,pfx);const r=await fetch(`/api/${SLUG}/preview`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({spec:sp,section:sid})});
  const u=URL.createObjectURL(await r.blob());document.querySelectorAll(`#sl_${sid}_${idx} img, #sl_ins_${sid}_${idx} img`).forEach(i=>i.src=u);}
async function saveSlide(sid,idx,pfx=""){const sec=S.sections.find(s=>s.id===sid);const sp=collect(sid,idx,pfx);
  if(!sec.slides.every(x=>x.spec.narration!==undefined)) await api("adopt_split",{section:sid});   // 자동 분배를 먼저 확정
  await api("slide",{section:sid,idx,spec:sp});await load();await preview(sid,idx);INS.key=null;updateInspector(true);toast("저장됨 — 대본을 바꿨으면 '이 섹션 음성 재생성' → 전체 재렌더");}
async function op(sid,idx,o){await api("slide",{section:sid,idx,op:o});await load();}
function changeKind(sid,idx,k){const sl=S.sections.find(s=>s.id===sid).slides[idx];sl.spec={kind:k,alt:sl.spec.alt,weight:sl.spec.weight};render();}
async function saveNar(sid){const r=await api("narration",{section:sid,narration:$(`#nar_${sid}`).value});toast(`대본 저장됨 (${r.chars}字). 음성 재생성 필요`);}
async function retts(sid){if(!confirm("이 섹션 음성을 다시 만들고 영상을 렌더합니다 (ElevenLabs 크레딧 사용)"))return;await api("tts",{sections:[sid]});poll();}
async function reslice(sid){const sec=prompt(`${sid?sid+" 섹션":"전체"}을 AI로 더 잘게 나눕니다 (대본 불변, 음성 재사용, 토큰만 사용).\n1슬라이드 목표 초수를 입력 (작을수록 더 잘게):`,"18");if(!sec)return;
  try{await api("reslice",{section:sid||null,sec:parseFloat(sec)});toast("재구성 + 재렌더 시작 (수 분 소요)");poll();}catch(e){alert("실행 실패: "+e.message)}}
async function job(name,body){if(!confirm(name+" 실행?"))return;try{await api(name,body||{});poll();}catch(e){alert("실행 실패: "+e.message)}}
async function previewThumb(){const r=await fetch(`/api/${SLUG}/preview`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({thumbnail:thumbSpec()})});$("#thumb").src=URL.createObjectURL(await r.blob());}
function thumbSpec(){const g=i=>$("#th_"+i).value;return {ribbon:g("ribbon"),title:g("title"),left:{note:g("lnote"),label:g("llab"),verdict:g("lver")},right:{note:g("rnote"),label:g("rlab"),verdict:g("rver")}}}
async function saveThumb(){await api("meta",{thumbnail:thumbSpec()});toast("썸네일 저장됨 (재렌더 시 반영)");}
async function saveTitle(){await api("meta",{title:$("#ytitle").value});toast("제목 저장됨");}
function toggleLog(){const l=$("#log");l.style.display=l.style.display==="none"?"":"none";}
function toast(m){const d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:9";document.body.appendChild(d);setTimeout(()=>d.remove(),2500);}
// ---------- 배치 편집기 ----------
let ED={sid:null,idx:null,ovs:[],sel:-1,drag:null};
const SC=0.7;
async function edOpen(sid,idx,pfx=""){ED.sid=sid;ED.idx=idx;const sp=collect(sid,idx,pfx);ED.base=Object.assign({},sp,{overlays:[]});ED.ovs=JSON.parse(JSON.stringify(sp.overlays||[]));ED.sel=-1;
  $("#ed").style.display="flex";$("#edRestoreBtn").style.display=sp._orig?"":"none";
  const r=await fetch(`/api/${SLUG}/preview`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({spec:ED.base,section:sid})});
  $("#cv").style.backgroundImage=`url(${URL.createObjectURL(await r.blob())})`;edDraw();}
function edClose(){$("#ed").style.display="none";}
async function edExplode(){if(!confirm("이 화면의 제목·항목·표 셀을 전부 개별 요소로 바꿉니다. 이후엔 폼(title/items 등) 대신 편집창에서 직접 고칩니다. 계속?"))return;
  const r=await api("explode",{spec:Object.assign({},ED.base,{overlays:ED.ovs}),section:ED.sid});const sp=r.spec;
  ED.ovs=sp.overlays;ED.base=Object.assign({},sp,{overlays:[]});ED.sel=-1;
  const pv=await fetch(`/api/${SLUG}/preview`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({spec:ED.base,section:ED.sid})});
  $("#cv").style.backgroundImage=`url(${URL.createObjectURL(await pv.blob())})`;$("#edRestoreBtn").style.display="";edDraw();toast("요소로 변환됨 — 저장하면 확정");}
async function edRestore(){if(!ED.base._orig||!confirm("자동 레이아웃으로 되돌립니다 (배치 편집 내용은 사라짐)"))return;const o=ED.base._orig;ED.base=Object.assign({},o,{overlays:[]});ED.ovs=[];ED.sel=-1;
  const pv=await fetch(`/api/${SLUG}/preview`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({spec:ED.base,section:ED.sid})});
  $("#cv").style.backgroundImage=`url(${URL.createObjectURL(await pv.blob())})`;$("#edRestoreBtn").style.display="none";edDraw();}
function addOv(t){const base={x:200,y:300,w:700,h:140,size:56,bold:true,color:"#1e1e1e",bg:"transparent",border:"none",radius:0,align:"center",opacity:1,pad:10,text:""};
  if(t==="text") Object.assign(base,{text:"ここに文字"});
  if(t==="box") Object.assign(base,{text:"",bg:"#ffffff",border:"6px solid #d32f2f",radius:20});
  if(t==="hl") Object.assign(base,{text:"",bg:"rgba(255,213,79,.55)",radius:10,h:110});
  if(t==="arrow") Object.assign(base,{text:"➜",size:160,color:"#d32f2f",w:220,h:200});
  ED.ovs.push(base);ED.sel=ED.ovs.length-1;edDraw();}
function delOv(){if(ED.sel<0)return;ED.ovs.splice(ED.sel,1);ED.sel=-1;edDraw();}
function edDraw(){const cv=$("#cv");cv.innerHTML=ED.ovs.map((o,i)=>`<div class="ovx ${i===ED.sel?"sel":""}" data-i="${i}" style="left:${o.x*SC}px;top:${o.y*SC}px;width:${o.w*SC}px;height:${o.h*SC}px;font-size:${o.size*SC}px;font-weight:${o.bold?900:500};color:${o.color};background:${o.bg};border:${(o.border||"none").replace(/(\d+)px/,(m,n)=>(n*SC)+"px")};border-radius:${o.radius*SC}px;justify-content:${{left:"flex-start",right:"flex-end"}[o.align]||"center"};text-align:${o.align};padding:${(o.pad||10)*SC}px;opacity:${o.opacity}">${esc(o.text)}<div class="rz" data-rz="1"></div></div>`).join("");
  edProps();}
function edProps(){const o=ED.ovs[ED.sel];const P=$("#props");if(!o){P.innerHTML="<small style='color:#666'>요소를 클릭하면 속성이 나옵니다</small>";return;}
  const I=(l,k,type="text")=>`<label>${l}</label><input type="${type}" value="${esc(o[k])}" oninput="edSet('${k}',this.value)">`;
  P.innerHTML=`<label>텍스트</label><textarea rows="3" oninput="edSet('text',this.value)">${esc(o.text)}</textarea>
  <div class="two">${I("글자 크기(px)","size","number")}<div><label>굵게</label><input type="checkbox" ${o.bold?"checked":""} onchange="edSet('bold',this.checked)"></div></div>
  <div class="two"><div><label>글자색</label><input type="color" value="${/^#/.test(o.color)?o.color:"#1e1e1e"}" oninput="edSet('color',this.value)"></div><div><label>정렬</label><select onchange="edSet('align',this.value)">${["left","center","right"].map(a=>`<option ${a===o.align?"selected":""}>${a}</option>`).join("")}</select></div></div>
  <label>배경 (예: #fff, rgba(255,213,79,.5), transparent)</label><input value="${esc(o.bg)}" oninput="edSet('bg',this.value)">
  <label>테두리 (예: 6px solid #d32f2f, none)</label><input value="${esc(o.border)}" oninput="edSet('border',this.value)">
  <div class="two">${I("모서리 둥글기","radius","number")}${I("투명도 0~1","opacity","number")}</div>
  <div class="two">${I("X","x","number")}${I("Y","y","number")}</div><div class="two">${I("W","w","number")}${I("H","h","number")}</div>
  <div class="row"><button onclick="edQuick('red')">빨강 강조</button><button onclick="edQuick('callout')">노란 말풍선</button><button onclick="edQuick('white')">흰 글자+남색 상자</button></div>`;}
function edSet(k,v){const o=ED.ovs[ED.sel];if(!o)return;o[k]=["size","radius","opacity","x","y","w","h"].includes(k)?parseFloat(v):v;const keep=document.activeElement;edDrawKeep();}
function edDrawKeep(){const cv=$("#cv");const o=ED.ovs[ED.sel];const el=cv.querySelector(`[data-i="${ED.sel}"]`);if(!el){edDraw();return;}
  el.style.cssText=`left:${o.x*SC}px;top:${o.y*SC}px;width:${o.w*SC}px;height:${o.h*SC}px;font-size:${o.size*SC}px;font-weight:${o.bold?900:500};color:${o.color};background:${o.bg};border:${(o.border||"none").replace(/(\d+)px/,(m,n)=>(n*SC)+"px")};border-radius:${o.radius*SC}px;justify-content:${{left:"flex-start",right:"flex-end"}[o.align]||"center"};text-align:${o.align};padding:${(o.pad||10)*SC}px;opacity:${o.opacity}`;
  el.firstChild.nodeValue!==undefined&&(el.childNodes[0].nodeType===3?el.childNodes[0].nodeValue=o.text:el.insertBefore(document.createTextNode(o.text),el.firstChild));}
function edQuick(t){const o=ED.ovs[ED.sel];if(!o)return;if(t==="red")Object.assign(o,{color:"#d32f2f",bold:true,bg:"transparent",border:"none"});
  if(t==="callout")Object.assign(o,{bg:"#fff3cd",border:"4px solid #e6c15a",radius:40,color:"#1e1e1e",bold:true,pad:30});
  if(t==="white")Object.assign(o,{bg:"#1a3a5c",color:"#ffffff",radius:14,bold:true,border:"none"});edDraw();}
function cvDown(e){const el=e.target.closest(".ovx");if(!el){ED.sel=-1;edDraw();return;}
  ED.sel=parseInt(el.dataset.i);const o=ED.ovs[ED.sel];const rz=!!e.target.dataset.rz;ED.drag={rz,sx:e.clientX,sy:e.clientY,ox:o.x,oy:o.y,ow:o.w,oh:o.h};edDraw();
  const mv=ev=>{const dx=(ev.clientX-ED.drag.sx)/SC,dy=(ev.clientY-ED.drag.sy)/SC;if(ED.drag.rz){o.w=Math.max(60,Math.round(ED.drag.ow+dx));o.h=Math.max(40,Math.round(ED.drag.oh+dy));}else{o.x=Math.round(ED.drag.ox+dx);o.y=Math.round(ED.drag.oy+dy);}edDrawKeep();};
  const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);edProps();};
  document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);}
$("#cv").addEventListener("dblclick",e=>{const el=e.target.closest(".ovx");if(!el)return;const o=ED.ovs[parseInt(el.dataset.i)];const t=prompt("텍스트",o.text);if(t!==null){o.text=t;edDraw();}});
document.addEventListener("keydown",e=>{if($("#ed").style.display==="flex"&&e.key==="Delete"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA")delOv();});
async function edPreview(){const sp=Object.assign({},ED.base,{overlays:ED.ovs});const r=await fetch(`/api/${SLUG}/preview`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({spec:sp,section:ED.sid})});
  const w=window.open("");w.document.write(`<img src="${URL.createObjectURL(await r.blob())}" style="max-width:100%">`);}
async function edSave(){const sp=Object.assign({},ED.base,{overlays:ED.ovs});
  await api("slide",{section:ED.sid,idx:ED.idx,spec:sp});edClose();await load();await preview(ED.sid,ED.idx);INS.key=null;updateInspector(true);toast("배치 저장됨 (영상 반영은 전체 재렌더)");}
// ---------- 재생 중인 슬라이드 편집 폼 ----------
let INS={key:null};
function updateInspector(force){const t=$("#video").currentTime||0;let hit=null;
  for(const sec of S.sections)for(const sl of sec.slides)if(t>=sl.start&&t<sl.end){hit={sec,sl};break;}
  if(!hit){const sec=S.sections[0];if(!sec)return;hit={sec,sl:sec.slides[0]};}
  const key=hit.sec.id+"_"+hit.sl.idx;if(key===INS.key&&!force)return;INS.key=key;
  document.querySelectorAll(".sl.playing").forEach(e=>e.classList.remove("playing"));$(`#sl_${key}`)?.classList.add("playing");
  $("#inspector").innerHTML=`<div style="font-weight:700;margin-bottom:6px">▶ 지금 화면: <span style="color:#2b5fd9">${hit.sec.id}</span> #${hit.sl.idx+1}</div>`+slideCard(hit.sec.id,hit.sl,"ins_");}
let timer=null;function poll(){clearInterval(timer);timer=setInterval(async()=>{await load();if(!S.running){clearInterval(timer);toast("작업 완료");}},4000);}
load();
</script></body></html>
